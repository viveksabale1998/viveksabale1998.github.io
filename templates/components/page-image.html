{% macro page_image(image, image_alt) %}
{% set c = 'c-page-image' %}
<div class="container">
  <div class="row">
    <div class="col col-12">
      <div class="{{c}} image-align-{{ image_align | default(value="center") }} animate">
        <img loading="lazy" src="{{ get_url(path=image) }}" alt="{{ image_alt }}"
          style="max-height: 420px; width: 100%; max-width: 760px; object-fit: cover; border-radius: 14px; box-shadow: 0 8px 24px rgba(0, 54, 135, 0.08); margin: 1rem auto 2.5rem; display: block;">
      </div>
    </div>
  </div>
</div>
{% endmacro page_image %}
