# The URL the site will be built for
base_url = "https://viveksabale1998.github.io/"
# theme = "vonge"

title = "Home"
author = "Vivek Sabale"
description = "Academic website of Vivek Sabale — research in quantum information and open quantum systems."

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

generate_feeds = true
feed_filenames = [ "atom.xml",]
minify_html = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

taxonomies = [
    { name = "tags", feed = true},
]

[markdown]
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
highlight_code = false

[extra]
logo_image = "V.svg"
social_media_share_image = "assets/profile.jpeg"
disqus_identifier = ""
google_analytics = ""
twitter_handle = ""

author_image = 'assets/profile.jpeg'

navigation = [
    { url = "$BASE_URL", title = "Home" },
    { url = "$BASE_URL/codes", title = "Codes" },
    { url = "$BASE_URL/publications", title = "Publications" },
    #{ url = "$BASE_URL/experience", title = "Experience" },
{ url = "$BASE_URL/awards", title = "Education & Awards" },
    { url = "$BASE_URL/cv", title = "CV" },
    { url = "$BASE_URL/posts", title = "Blog" },

    { url = "$BASE_URL/gallery", title = "Gallery" }
]
social_icons = [
    { url = "https://github.com/viveksabale1998/sites", icon = "GitHub" },
    { url = "https://www.linkedin.com/in/vivek-sabale/", icon = "Linkedin" },
    { url = "https://scholar.google.com/citations?user=LdMLDdwAAAAJ&hl=en", icon = "Google Scholar" },
    # { url = "https://orcid.org/0009-0008-1278-5120", icon = "Orcid" },
]
date_format = "%d %b %Y"
language_direction = "auto"
keywords = ["keyword1", "keyword2", "keyword3"]

